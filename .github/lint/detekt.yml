# Complexity limits only; other detekt rule sets are off so the gate stays about size and nesting.
complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
  NestedBlockDepth:
    active: true
    threshold: 4
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
comments:
  active: false
coroutines:
  active: true
empty-blocks:
  active: true
exceptions:
  active: false
naming:
  active: false
performance:
  active: true
potential-bugs:
  active: true
style:
  active: false
